[package]
name = "myccmonitor-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "json",
] }

# Serialization & error
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Common types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
time = "0.3"
url = "2"
async-trait = "0.1"
dashmap = "6"
futures = "0.3"
serde_bytes = "0.11"

# OAuth 1.0a (Clever Cloud)
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"

# AES-GCM for OAuth tokens at rest
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

# Workflow engine
petgraph = "0.6"
handlebars = "6"

# Pulsar event bus (CC addon)
pulsar = { version = "6", default-features = false, features = ["tokio-runtime"] }

# Notifications: email
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
